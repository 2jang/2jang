name: Waka Readme Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-readme:
    name: Update WakaReadme Stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          API_BASE_URL: ${{ secrets.WAKAPI_BASE_URL }}
          WAKATIME_API_KEY: ${{ secrets.WAKAPI_API_KEY }}

          TIME_RANGE: last_30_days
          SHOW_TIME: true
          BLOCKS: "⬜🟨🟩"
          SHOW_TITLE: true

          COMMIT_MESSAGE: "Update Wakapi stats"
          AUTHOR_NAME: 2jang
          AUTHOR_EMAIL: jakeecc@naver.com
          COMMITTER_NAME: 2jang
          COMMITTER_EMAIL: jakeecc@naver.com
